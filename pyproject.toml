[project]
name = "cc-nqe"
version = "0.1.0"
description = "Controlled 4-qubit context-conditioned neural emulator feasibility experiment"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch==2.10.0", "psutil>=6", "threadpoolctl>=3.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
